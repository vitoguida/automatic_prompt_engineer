generation:
  num_subsamples: 2 # subsamples size => Numero di sample presi dal dataset per creare i query prompt
  num_demos: 5 # few-shot demonstration in the generated prompt
  num_prompts_per_subsample: 4 # numero di prompt generati per ogni subsample per risolvere il task
  # => num_subsamples == Query da testare, num_prompts_per_subsample => Num risposte per ogni query.
  # num_demos

  model:
    name: LocalLlama
    batch_size: 500
    model_config:
      model: meta-llama/Llama-3.2-3B-Instruct
      temperature: 0.9
      max_tokens: 500
      top_p: 0.9
      frequency_penalty: 0.0
      presence_penalty: 0.0

evaluation:
  method: exec_accuracy
  num_samples: 20 # Numero di sample da usare per l'evaluation presi dal dataset
  # => Valida su quanti sample un prompt è efficace per risolvere il task.
  #n=config['num_prompts_per_subsample']
  num_few_shot: 5
  model:
    name: LocalLlama
    batch_size: 20
    model_config:
      model: meta-llama/Llama-3.2-3B-Instruct
      temperature: 0.9
      max_tokens: 500
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0

# Parameters for the demo model ?
demo:
  model:
    name: LocalLlama
    batch_size: 500
    model_config:
      model: meta-llama/Llama-3.2-3B-Instruct
      temperature: 0
      max_tokens: 500
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
